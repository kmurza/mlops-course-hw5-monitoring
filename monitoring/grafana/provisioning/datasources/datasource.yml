apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    uid: postgres-fraud
    url: postgres-scoring:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: fraud_db
      sslmode: disable
    editable: false