global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: scorer
    static_configs:
      - targets: ['scorer:8000']

  - job_name: db_consumer
    static_configs:
      - targets: ['db_consumer:8000']